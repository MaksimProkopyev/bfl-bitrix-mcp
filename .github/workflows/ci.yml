name: CI
on:
  push:
    branches: [develop, main]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate JSON Schemas with ajv (+formats)
        run: |
          npx --yes -p ajv-cli@5 -p ajv-formats ajv compile \
            -c ajv-formats \
            -s schemas/query_watcher_output.json \
            -s schemas/batch_candidates.json \
            -s schemas/scrubber_output.json
